# =====================================================================
#  KANTOR VIRTUAL @asn_go_digitals — konfigurasi utama
#  Ubah file ini saja untuk mengatur gaya konten, jadwal, dan produk.
# =====================================================================

brand:
  handle: "@asn_go_digitals"
  name: "ASN GO Digitals"
  tagline: "Digitalisasi ASN • Pemerintahan Desa • AI"
  wordmark: "ASN GO DIGITALS"
  audience: >
    ASN (PNS & PPPK), perangkat desa, kepala desa, pendamping desa, operator
    SIPD/Siskeudes, dan pegawai pemda yang ingin kerja lebih cepat dengan
    teknologi digital dan AI.
  voice: >
    Bahasa Indonesia santai-profesional, seperti rekan kerja senior yang jago
    teknologi. Praktis, langkah demi langkah, tanpa jargon berlebihan.
    Sapaan: "Rekan ASN", "Sobat Desa". Boleh sedikit humor kantor.
  # Warna carousel (hex). Navy + merah-putih + emas batik.
  colors:
    bg: "#0B1F3A"
    bg2: "#12305A"
    accent: "#E63946"
    gold: "#F4B942"
    text: "#FFFFFF"
    muted: "#B8C4D6"

# Virtual influencer — wajah akun di cover & slide penutup.
# Foto pose ada di assets/influencer/*.png (latar sudah dihapus). Tambah pose baru = tambah file PNG
# lalu tulis namanya di poses.
influencer:
  name: "Cicilia"
  persona: >
    ASN muda yang melek teknologi, ramah, sabar menjelaskan, suka berbagi trik kerja cepat
    pakai AI dan aplikasi digital. Menyapa dengan "Halo Rekan ASN & Sobat Desa!".
  poses: [melipat_tangan, presentasi, berdiri]
  # Arahan gaya untuk foto AI (mode Gemini). Ubah sesuai keinginan Anda.
  style_guard: "Seragam dikenakan rapi dan sopan dengan kancing atas terpasang, pose profesional."
  # Label transparansi AI (dianjurkan Meta untuk gambar realistis buatan AI).
  disclosure: ""   # kosong = tidak ada kalimat label AI di caption

# Tiga pilar konten (sesuai bio). Agent memutar pilar per hari.
pillars:
  - id: asn
    name: "Digitalisasi ASN"
    topics:
      - SPBE, e-Kinerja/SKP digital, MyASN, SIASN, e-Office
      - tips produktivitas ASN pakai tools digital gratis
      - keamanan data & tanda tangan elektronik (TTE/BSrE)
      - Google Workspace / Excel untuk laporan kantor
  - id: desa
    name: "Pemerintahan Desa"
    topics:
      - administrasi desa, tata naskah dinas desa, SK Kades, Perdes
      - perencanaan RPJMDes, RKPDes, APBDes, Siskeudes
      - dana desa, BUMDes, pelaporan & pertanggungjawaban
      - digitalisasi layanan desa, website desa, Prodeskel/IDM
  - id: ai
    name: "AI untuk Kerja Kantor"
    topics:
      - prompt ChatGPT/Claude/Gemini untuk surat dinas, notulen, laporan
      - AI untuk membuat bahan paparan, ringkasan regulasi, analisis data
      - etika & keamanan data saat pakai AI di instansi
      - tools AI gratis untuk ASN dan perangkat desa

# Format konten mingguan (0=Senin ... 6=Minggu). Waktu dalam WIT.
weekly_plan:
  0: {pillar: ai,   format: carousel_tutorial}
  1: {pillar: desa, format: carousel_tutorial}
  2: {pillar: asn,  format: carousel_listicle}
  3: {pillar: ai,   format: carousel_prompt}     # "contekan prompt"
  4: {pillar: desa, format: carousel_listicle}
  5: {pillar: asn,  format: carousel_mitos}       # mitos vs fakta
  6: {pillar: any,  format: carousel_promo}       # soft-selling produk lynk.id

# JADWAL 8 POSTINGAN/HARI (4 carousel edukasi + 2 berita terkini + 2 Reels). Jam dalam WIT; jadwal di .github/workflows/kantor.yml.
# Pilar berputar tiap slot & tiap hari; format dipilih bergiliran dari daftar "formats".
# GitHub kadang terlambat menjalankan jadwal (beberapa menit s.d. ±1 jam).
slot_autopublish: true     # true = langsung terbit (konten berisiko tinggi tetap menunggu ✅ Bos)
slots:
  - {time: "06:30", type: carousel, formats: [carousel_listicle, carousel_tutorial, carousel_prompt]}
  - {time: "08:00", type: berita}
  - {time: "09:00", type: reels}
  - {time: "12:00", type: carousel, formats: [carousel_prompt, carousel_tutorial, carousel_listicle]}
  - {time: "15:30", type: carousel, formats: [carousel_mitos, carousel_listicle, carousel_tutorial]}
  - {time: "17:00", type: berita}
  - {time: "18:30", type: reels}
  - {time: "20:00", type: carousel, formats: [carousel_promo, carousel_tutorial, carousel_listicle]}

# Jam posting harian (WIT). GitHub Actions memakai UTC (WIT = UTC+9).
post_hour_wit: 19

# Mode persetujuan: true = setiap draft dikirim ke Telegram dulu dan baru
# terbit setelah Anda tekan ✅. SANGAT disarankan untuk niche pemerintahan.
require_approval: true

# BERITA TERKINI — carousel dari media tepercaya (dirangkum ulang + sumber & tautan di caption).
berita:
  # Bila foto_media false, foto hanya diambil dari situs pemerintah & Wikimedia.
  foto_dari: [".go.id", "wikimedia.org"]
  # true = foto diambil dari media sumber berita (Kompas, Detik, dll) + kredit foto di slide & caption.
  foto_media: true
  maks_foto: 6
  sumber_tepercaya: [antaranews.com, kompas.com, kompas.id, detik.com, cnnindonesia.com, tempo.co, liputan6.com, republika.co.id,
                     bisnis.com, kontan.co.id, katadata.co.id, tirto.id, kumparan.com, rri.co.id, tvri.go.id, jpnn.com, idntimes.com,
                     .go.id]
  kueri:
    asn: ["ASN", "PNS", "PPPK", "KemenPANRB", "BKN", "SPBE"]
    desa: ["dana desa", "kepala desa", "pemerintahan desa", "Kemendes", "kampung Papua"]
    ai: ["kecerdasan buatan Indonesia", "AI pemerintah", "transformasi digital pemerintah", "Komdigi"]

# SUARA & MUSIK video Reels/TikTok
suara:
  aktif: true                 # narasi Cicilia
  voice: "id-ID-GadisNeural"  # suara perempuan Indonesia (Microsoft Edge TTS, gratis)
  rate: "+6%"                 # kecepatan bicara
  pitch: "+12Hz"              # sedikit lebih tinggi = lebih manis
  musik: true                 # musik latar buatan sendiri (bebas royalti) atau MP3 di assets/music/
  volume_musik: 0.16

# TikTok: setiap konten terbit, bot mengirim paket TikTok (video 9:16 + caption) ke Telegram.
tiktok:
  enabled: true
  handle: "@asn_go_digital"
  hashtags: ["#fyp", "#asn", "#pns", "#pppk", "#perangkatdesa", "#tipskerja"]

