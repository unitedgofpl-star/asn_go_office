name: Kantor Virtual ASN GO

on:
  # Model sama dengan Kantor United Go: perintah Telegram masuk lewat Cloudflare Worker (instan),
  # jadwal hanya beberapa kali sehari (GitHub bisa terlambat, jadi jangan andalkan jadwal rapat).
  schedule:   # UTC = WIT - 9 jam; menit sengaja tidak bulat agar tidak antre di jam sibuk GitHub
    - cron: "31 21 * * *"    # 06:30 WIT — slot 0 carousel edukasi
    - cron: "47 22 * * *"    # 07:47 WIT — slot 1 BERITA TERKINI
    - cron: "7 0 * * *"      # 09:00 WIT — slot 2 Reels
    - cron: "3 3 * * *"      # 12:00 WIT — slot 3 carousel edukasi
    - cron: "33 6 * * *"     # 15:30 WIT — slot 4 carousel edukasi
    - cron: "43 7 * * *"     # 16:43 WIT — slot 5 BERITA TERKINI
    - cron: "29 9 * * *"     # 18:30 WIT — slot 6 Reels
    - cron: "57 10 * * *"    # 20:00 WIT — slot 7 carousel edukasi / promo
    - cron: "17 1 * * 1"     # Senin 10:15 WIT — laporan mingguan
  workflow_dispatch:
    inputs:
      mode:
        description: "poll | cek | slot | daily | weekly | event | demo"
        default: "poll"
      update:
        description: "(diisi otomatis oleh bot Telegram)"
        default: ""
      slot:
        description: "nomor slot 0-7 (untuk mode slot)"
        default: "0"

concurrency:
  group: kantor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  kerja:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Ambil buku kerja terbaru (run yang mengantre tidak boleh pakai data basi)
        run: git pull --ff-only origin main || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null

      - name: Tentukan mode
        id: m
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            "schedule:31 21 * * *") echo "mode=slot" >> $GITHUB_OUTPUT; echo "slot=0" >> $GITHUB_OUTPUT ;;
            "schedule:47 22 * * *") echo "mode=slot" >> $GITHUB_OUTPUT; echo "slot=1" >> $GITHUB_OUTPUT ;;
            "schedule:7 0 * * *") echo "mode=slot" >> $GITHUB_OUTPUT; echo "slot=2" >> $GITHUB_OUTPUT ;;
            "schedule:3 3 * * *") echo "mode=slot" >> $GITHUB_OUTPUT; echo "slot=3" >> $GITHUB_OUTPUT ;;
            "schedule:33 6 * * *") echo "mode=slot" >> $GITHUB_OUTPUT; echo "slot=4" >> $GITHUB_OUTPUT ;;
            "schedule:43 7 * * *") echo "mode=slot" >> $GITHUB_OUTPUT; echo "slot=5" >> $GITHUB_OUTPUT ;;
            "schedule:29 9 * * *") echo "mode=slot" >> $GITHUB_OUTPUT; echo "slot=6" >> $GITHUB_OUTPUT ;;
            "schedule:57 10 * * *") echo "mode=slot" >> $GITHUB_OUTPUT; echo "slot=7" >> $GITHUB_OUTPUT ;;
            "schedule:17 1 * * 1")  echo "mode=weekly" >> $GITHUB_OUTPUT ;;
            *) echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT; echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Karyawan AI bekerja
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IMAGE_MODE: ${{ secrets.IMAGE_MODE }}
          UPDATE_JSON: ${{ inputs.update }}
          SLOT: ${{ steps.m.outputs.slot }}
        run: python -m office.main ${{ steps.m.outputs.mode }}

      - name: Simpan buku kerja kantor
        if: always()
        run: |
          git config user.name "kantor-bot"
          git config user.email "kantor-bot@users.noreply.github.com"
          mkdir -p data public && touch data/.gitkeep public/.gitkeep
          git add data public
          git diff --cached --quiet && exit 0
          git commit -m "kantor: ${{ steps.m.outputs.mode }} $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
