name: Kantor Virtual ASN GO

on:
  schedule:
    - cron: "*/5 * * * *"    # Pak Kepala piket ±4,5 menit (long polling) + Mbak Humas terbitkan yang jatuh tempo
    - cron: "0 22 * * *"     # 07:00 WIT — tim produksi membuat draft harian
    - cron: "0 1 * * 1"      # Senin 10:00 WIT — laporan mingguan Kak Analis
  repository_dispatch:
    types: [telegram]        # mode instan (opsional, via Cloudflare Worker)
  workflow_dispatch:
    inputs:
      mode:
        description: "poll | cek | daily | weekly | demo"
        default: "poll"

concurrency:
  group: kantor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  kerja:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null

      - name: Tentukan mode
        id: m
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            "schedule:0 22 * * *") echo "mode=daily" >> $GITHUB_OUTPUT ;;
            "schedule:0 1 * * 1")  echo "mode=weekly" >> $GITHUB_OUTPUT ;;
            schedule:*)            echo "mode=poll" >> $GITHUB_OUTPUT ;;
            repository_dispatch:*) echo "mode=event" >> $GITHUB_OUTPUT ;;
            *)                     echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Karyawan AI bekerja
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IMAGE_MODE: ${{ secrets.IMAGE_MODE }}
          TELEGRAM_MODE: ${{ secrets.TELEGRAM_MODE }}
        run: python -m office.main ${{ steps.m.outputs.mode }}

      - name: Simpan buku kerja kantor
        if: always()
        run: |
          git config user.name "kantor-bot"
          git config user.email "kantor-bot@users.noreply.github.com"
          mkdir -p data public && touch data/.gitkeep public/.gitkeep
          git add data public
          git diff --cached --quiet && exit 0
          git commit -m "kantor: ${{ steps.m.outputs.mode }} $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
